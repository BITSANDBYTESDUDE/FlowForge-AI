# Local development services for FlowForge AI.
#
# Only MongoDB is required to run the app. Redis and the S3-compatible store are
# optional: without Redis the app uses an in-memory rate limiter, and without S3
# avatars are URL-based. They are included here as opt-in profiles so a
# developer can bring up the full production-shaped stack when they need it.
#
#   docker compose up -d                # MongoDB only (the common case)
#   docker compose --profile full up -d # + Redis + MinIO
#
#   docker compose down                 # stop
#   docker compose down -v              # stop and delete the data volume

services:
  mongo:
    image: mongo:7
    container_name: flowforge-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      # No auth locally: the container is bound to localhost and this keeps the
      # MONGODB_URI in .env.example valid without extra setup. Production uses
      # MongoDB Atlas with credentials.
      MONGO_INITDB_DATABASE: flowforge
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `docker compose up --wait` and dependent services rely on this, so it
      # uses the lightweight ping rather than a full server status read.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ------------------------------------------------------------------------ #
  # Optional services. Enable with `--profile full`.
  # ------------------------------------------------------------------------ #

  redis:
    profiles: ['full']
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # MinIO provides an S3-compatible API so the storage code path can be
  # exercised locally without a cloud account.
  minio:
    profiles: ['full']
    image: minio/minio:latest
    container_name: flowforge-minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    environment:
      MINIO_ROOT_USER: flowforge
      MINIO_ROOT_PASSWORD: flowforge-dev-secret
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
  redis-data:
  minio-data:
